<svg xmlns="http://www.w3.org/2000/svg" width="960" height="256" viewBox="0 0 960 256" role="img" aria-labelledby="title description">
  <title id="title">Tech Stack &amp; Tools</title>
  <desc id="description">Tecnologías de Marcelo Bedoya Ostolaza en tarjetas oscuras con animación escalonada de flotación y pulso.</desc>
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .84; }
    }
    .tech-card {
      transform-box: fill-box;
      transform-origin: center;
      animation: float 4.8s ease-in-out infinite, pulse 4.8s ease-in-out infinite;
    }
    .tech-card:nth-of-type(2) { animation-delay: .18s, .18s; }
    .tech-card:nth-of-type(3) { animation-delay: .36s, .36s; }
    .tech-card:nth-of-type(4) { animation-delay: .54s, .54s; }
    .tech-card:nth-of-type(5) { animation-delay: .72s, .72s; }
    .tech-card:nth-of-type(6) { animation-delay: .9s, .9s; }
    .tech-card:nth-of-type(7) { animation-delay: 1.08s, 1.08s; }
    .tech-card:nth-of-type(8) { animation-delay: 1.26s, 1.26s; }
    .tech-card:nth-of-type(9) { animation-delay: 1.44s, 1.44s; }
    .tech-card:nth-of-type(10) { animation-delay: 1.62s, 1.62s; }
    .tech-card:nth-of-type(11) { animation-delay: 1.8s, 1.8s; }
    .tech-card:nth-of-type(12) { animation-delay: 1.98s, 1.98s; }
    .tech-card:nth-of-type(13) { animation-delay: 2.16s, 2.16s; }
    .tech-card:nth-of-type(14) { animation-delay: 2.34s, 2.34s; }
    .tech-card:nth-of-type(15) { animation-delay: 2.52s, 2.52s; }
    .tech-card:nth-of-type(16) { animation-delay: 2.7s, 2.7s; }
    .tech-card:nth-of-type(17) { animation-delay: 2.88s, 2.88s; }
    .tech-card:nth-of-type(18) { animation-delay: 3.06s, 3.06s; }
    @media (prefers-reduced-motion: reduce) {
      .tech-card { animation: none; }
    }
  </style>
  <rect width="960" height="256" rx="12" fill="#0d1117"/>

  <g class="tech-card">
