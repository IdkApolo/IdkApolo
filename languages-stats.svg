<svg xmlns="http://www.w3.org/2000/svg" width="980" height="370" viewBox="0 0 980 370" role="img" aria-labelledby="title description">
  <title id="title">Language statistics for IdkApolo</title>
  <desc id="description">Representative stack distribution: TypeScript 32 percent, Java 24 percent, Python 18 percent, JavaScript 14 percent, SQL 8 percent, and HTML/CSS 4 percent.</desc>
